- id: ai-lint
  name: ai-lint
  description: Lint and repair AI agent configuration
  entry: python3 ai-lint.py
  language: system
  types: [file]
  files: |
    (?x)^(
      \.claude/settings.*\.json|
      \.claude/rules/.*\.md|
      \.claude/hooks/.*\.py|
      \.claude/skills/.*/(SKILL\.md|metadata\.yaml)|
      \.claude/agents/.*/(AGENTS\.md|metadata\.yaml)|
      CLAUDE\.md|
      AGENTS\.md|
      CLAUDE\.local\.md|
      \.mcp\.json|
      \.ai-lint\.toml|
      \.github/workflows/.*claude.*\.ya?ml
    )$
  stages: [commit]
  pass_filenames: false
  require_serial: true
