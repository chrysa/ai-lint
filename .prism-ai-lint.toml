# prism-ai-lint policy for this repository. Only what differs from the built-in defaults
# (python3 prism-ai-lint.py --print-policy shows them all).

[critical]
# This repository's own operating documents: guarded sessions need human validation
# before changing them, like CLAUDE.md, AGENTS.md and README.md.
extra_files = [
  "docs/FIXER_POLICY.md",
  "docs/CONVENTIONS.md",
  "docs/CLAUDE_CODE_BEST_PRACTICES.md",
]
