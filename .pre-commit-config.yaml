# Pre-commit hooks for ai-lint. Install with `make pre-commit-install`,
# run manually with `make pre-commit`. Mirrors the CI gate so a green local
# commit stays green in CI.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
        files: ^(ai_lint/|ai-lint\.py|tests/)
      - id: ruff-format
        name: ruff (format)
        files: ^(ai_lint/|ai-lint\.py|tests/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: mypy (engine + CLI)
        pass_filenames: false
        # mypy reads its file list and config from pyproject [tool.mypy].
        args: ["--config-file", "pyproject.toml"]
        additional_dependencies: ["types-PyYAML"]

  - repo: local
    hooks:
      # Fail on a real attribution trace or leaked secret introduced in-repo.
      - id: ai-lint-selfcheck
        name: ai-lint selfcheck (no in-repo traces/secrets)
        entry: python3 tests/_selfcheck.py
        language: system
        pass_filenames: false
        always_run: true
      # The tool must never gain assistant/AI attribution.
      - id: no-ai-attribution
        name: no assistant/AI attribution in staged files
        entry: python3 -c "import subprocess,sys,re; d=subprocess.run(['git','diff','--cached','--'],capture_output=True,text=True).stdout; pat=re.compile(r'(?i)co-authored-by:.*(claude|anthropic|copilot)|generated with .{0,20}(claude|copilot)'); bad=[l for l in d.splitlines() if l.startswith('+') and pat.search(l)]; sys.exit(bad and (print('attribution trace staged:', *bad, sep=chr(10)) or 1) or 0)"
        language: system
        pass_filenames: false
