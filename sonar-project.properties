# SonarCloud CI analysis. Runs from .github/workflows/ci.yml only when the SONAR_TOKEN
# secret exists (automatic analysis must be turned off in SonarCloud first).
sonar.organization=chrysa
sonar.projectKey=chrysa_agent-config-lint
sonar.projectName=prism-ai-lint
sonar.sources=prism_ai_lint,prism-ai-lint.py
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=.reports/coverage.xml
