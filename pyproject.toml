[project]
name = "claude-lint"
version = "2026.09.28-22"
description = "Validate, repair and harden Claude Code configurations. Single file, no runtime dependencies."
requires-python = ">=3.9"
dependencies = []  # the linter runs with the standard library alone

[project.optional-dependencies]
# Only needed for the editable catalog (--print-catalog / --catalog). The linter
# runs without it and those options degrade gracefully when it is absent.
catalog = ["PyYAML>=6"]
# Everything to run `make test` / `make lint` / `make selfcheck`.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "PyYAML>=6"]

[tool.coverage.run]
# claude_lint.py is imported normally, so coverage attaches to it. In-process
# (white-box) tests contribute; subprocess CLI runs are not counted here.
source = ["claude_lint"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
files = ["claude_lint.py", "claude-lint.py"]
python_version = "3.10"
# Type-checking catches real bugs here (arg-type, index, return types). Full
# `strict` on this dense single file is deferred: the bare-generic and
# untyped-def noise it raises is stylistic, not correctness. These checks are the
# bug-catching subset; annotations are added incrementally.
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
allow_redefinition = true
# type-arg/no-untyped-* are stylistic (bare generics, unannotated defs). The
# remaining no-any-return/attr-defined/index/arg-type/assignment/type-var cases
# are mypy failing to narrow dict/JSON values and regex groups in this dynamically
# shaped script; the real None-indexing bugs it found have been fixed. Annotating
# them fully is deferred. Keep the checks that catch genuine defects (call args on
# known signatures, undefined names, redefinitions, unreachable).
disable_error_code = [
    "type-arg", "no-untyped-def", "no-untyped-call", "var-annotated",
    "no-any-return", "attr-defined", "index", "arg-type", "assignment", "type-var", "misc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disable globally-installed pytest plugins that assume a Django app; this
# project is a standalone script with no framework.
addopts = "-ra -p no:query_optimizer -p no:django -p no:qt -p no:asyncio -p no:cacheprovider"

[tool.ruff]
line-length = 100  # shared-standards: max 100 chars
target-version = "py39"

[tool.ruff.lint]
# shared-standards code-style: E, W, I, N, UP (+ F, B kept for real-bug coverage).
select = ["E", "F", "W", "I", "N", "UP", "B"]
# Line length (max 100) is enforced by `ruff format`, which lays out code to the
# line-length above. E501 is left off because it only fires on long string
# literals that cannot be wrapped without harming readability or corrupting
# embedded generated templates. E741/E731/UP034 are deliberate style choices.
ignore = ["E501", "B008", "E741", "E731", "UP034"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
