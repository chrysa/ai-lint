[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lint"
version = "2026.09.28-22"
description = "Validate, repair and harden Claude Code configurations. Single file, no runtime dependencies."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "chrysa", email = "dev@chrysa.dev"}]
keywords = ["claude", "ai-agent", "linter", "security", "configuration"]
requires-python = ">=3.13"
dependencies = []  # the linter runs with the standard library alone

[project.urls]
Homepage = "https://github.com/chrysa/ai-lint"
Repository = "https://github.com/chrysa/ai-lint"
Issues = "https://github.com/chrysa/ai-lint/issues"
Changelog = "https://github.com/chrysa/ai-lint/releases"

[project.scripts]
ai-lint = "ai_lint._engine:main"

[project.optional-dependencies]
# Only needed for the editable catalog (--print-catalog / --catalog). The linter
# runs without it and those options degrade gracefully when it is absent.
catalog = ["PyYAML>=6"]
# Everything to run the local and CI quality gates.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "PyYAML>=6", "pre-commit>=3"]

[tool.coverage.run]
# ai_lint.py is imported normally, so coverage attaches to it. parallel +
# concurrency let coverage also measure the CLI runs the tests launch as
# subprocesses (started via COVERAGE_PROCESS_START); `coverage combine` merges them.
source = ["ai_lint"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
files = ["ai_lint", "ai-lint.py"]
python_version = "3.13"
# Type-checking catches real bugs here (arg-type, index, return types). Full
# `strict` on this dense single file is deferred: the bare-generic and
# untyped-def noise it raises is stylistic, not correctness. These checks are the
# bug-catching subset; annotations are added incrementally.
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
allow_redefinition = true
# type-arg/no-untyped-* are stylistic (bare generics, unannotated defs). The
# remaining no-any-return/attr-defined/index/arg-type/assignment/type-var cases
# are mypy failing to narrow dict/JSON values and regex groups in this dynamically
# shaped script; the real None-indexing bugs it found have been fixed. Annotating
# them fully is deferred. Keep the checks that catch genuine defects (call args on
# known signatures, undefined names, redefinitions, unreachable).
disable_error_code = [
    "type-arg", "no-untyped-def", "no-untyped-call", "var-annotated",
    "no-any-return", "attr-defined", "index", "arg-type", "assignment", "type-var", "misc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `ai_lint` imports under any invocation
# (`pytest`, `pytest tests/test_x.py`, a single node), not only a bare run from
# the root. Keeps the no-install, run-from-clone workflow working.
pythonpath = ["."]
# Disable globally-installed pytest plugins that assume a Django app; this
# project is a standalone script with no framework.
addopts = "-ra -p no:query_optimizer -p no:django -p no:qt -p no:asyncio -p no:cacheprovider"

[tool.ruff]
line-length = 120  # shared-standards: max 120 chars
target-version = "py313"

[tool.ruff.lint]
# shared-standards code-style: E, W, I, N, UP, B, plus BLE (never bare
# `except Exception` without justification) and B904 (raise ... from) via B.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE"]
# Line length (max 120) is enforced by `ruff format`, which lays out code to the
# line-length above. E501 is left off because it only fires on long string
# literals that cannot be wrapped without harming readability or corrupting
# embedded generated templates. E741/E731/UP034 are deliberate style choices.
ignore = ["E501", "B008", "E741", "E731", "UP034"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.setuptools]
packages = ["ai_lint"]
package-data = {"ai_lint" = ["py.typed"]}
