name: Release

# On every push to main, compute the next version and release notes from the
# Conventional Commits since the last tag (git-cliff — the version is derived,
# never typed), then tag the commit and cut a GitHub release. One commit on main
# = one release. No-op when there is nothing
# new to release (git-cliff yields the same version).
on:
  push:
    branches: [main]

permissions:
  contents: write  # create tags and releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history + tags for changelog and version bump

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: git-cliff

      - name: Compute next version
        id: version
        run: |
          set +e
          NEXT="$(git cliff --bumped-version 2>cliff.err)"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "git-cliff --bumped-version failed (rc=$rc):"; cat cliff.err || true
          fi
          echo "computed version: '${NEXT}'"
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Release if the version advanced
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "git-cliff produced no version; nothing to release."; exit 0
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing new to release."; exit 0
          fi
          git cliff --tag "$TAG" --unreleased --strip all --output RELEASE_NOTES.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          echo "released=true" >> "$GITHUB_OUTPUT"
        id: release

      # PyPI publication is opt-in: it runs only once the PYPI_API_TOKEN secret exists.
      - name: Build the distribution (version from the new tag)
        if: steps.release.outputs.released == 'true' && env.PYPI_API_TOKEN != ''
        run: |
          python -m pip install --only-binary :all: "build==1.6.1"
          python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
