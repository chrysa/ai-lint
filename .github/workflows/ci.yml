name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pytest pytest-cov ruff mypy PyYAML  # mirrors [project.optional-dependencies].dev in pyproject.toml
      - name: Lint (ruff check)
        run: python -m ruff check ai_lint.py ai-lint.py tests
      - name: Format check (max 100 chars)
        run: python -m ruff format --check ai_lint.py ai-lint.py tests
      - name: Type check (mypy)
        run: python -m mypy
      - name: Test
        run: python -m pytest -q
      - name: Coverage (CLI subprocesses included; floor 60%, target 90%)
        run: make cov
      - name: Self-check (no attribution or secrets in the repo)
        run: python tests/_selfcheck.py
